<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan to File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* One dark look on purpose: it matches the film. */
:root { --bg:#0b1834; --fg:#eef3ff; --muted:#9aa8c8; --green:#3ccd78; --line:#2a3f6e;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--mono); }
main { min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:20px max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left)); }
.label { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:center; }
canvas { width:min(100%, 420px); aspect-ratio:9/16; height:auto; border:1px solid var(--line); border-radius:14px; background:#0b1834; }
.row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:420px; }
button, label.btn { font:inherit; font-size:13px; color:var(--fg); background:#102042; border:1px solid var(--line);
  border-radius:10px; padding:10px 14px; cursor:pointer; }
button.primary { border-color:var(--green); color:var(--green); }
button:disabled { opacity:.5; cursor:default; }
label.btn { position:relative; overflow:hidden; }
label.btn input[type=file] { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:100px; }
p { margin:0; max-width:420px; font-size:12px; line-height:1.6; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <div class="label">UMS Gemini Pro · scan-to-file effect</div>
  <p id="status" style="color:#3ccd78;min-height:1.6em"></p>
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="row">
    <button class="primary" id="go">▶ Scan &amp; upload</button>
    <button id="fast">Batch mode (fast)</button>
    <label class="btn">Choose image<input type="file" id="file" accept="image/*"></label>
    <button id="rec" hidden>Record WebM</button>
  </div>
  <p>Sound on for the scanner buzz, whoosh and ding. You can also drop any image onto the screen. Everything runs in your browser; no image is uploaded anywhere.</p>
</main>
<script>
window.onerror = function (m) { var el = document.getElementById('status'); if (el) { el.style.color = '#ff70a8'; el.textContent = 'Error: ' + m; } };
window.onunhandledrejection = function (e) { window.onerror('promise: ' + (e.reason && (e.reason.message || e.reason.name) || e.reason)); };
/* ---------------- setup ---------------- */
var W = 1080, H = 1920;
var cv = document.getElementById('c'), cx = cv.getContext('2d');
var NAVY = '#0b1834', WHITE = '#eef3ff', DIM = '#96a5c8', GREEN = '#3ccd78', PINK = '#ff70a8';
var MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
var BOX_W = 860, BOX_H = 960, CENTER = [540, 860], MOUTH = [540, 1660], B = 22;

function clamp(x, a, b) { a = a === undefined ? 0 : a; b = b === undefined ? 1 : b; return x < a ? a : x > b ? b : x; }
function ss(x) { x = clamp(x); return x * x * (3 - 2 * x); }
function easeBack(x) { x = clamp(x); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* phase lengths in seconds: pop, scan, hold binary, fold, card, swallow */
var PH_HERO = [0.20, 1.00, 0.15, 0.25, 0.60, 0.30];
var PH_FAST = [0.08, 0.30, 0.04, 0.12, 0.20, 0.18];

/* ---------------- the three layers: original, pixel blocks, binary ---------------- */
var L = null, fileName = 'R47_TOP_SECRET.png', fileSize = '2.4 MB';
function buildLayers(img) {
  var s = Math.min(BOX_W / img.width, BOX_H / img.height);
  var w = Math.round(img.width * s), h = Math.round(img.height * s);
  var orig = mk(w, h), o = orig.getContext('2d');
  o.imageSmoothingQuality = 'high'; o.drawImage(img, 0, 0, w, h);
  var gw = Math.max(1, Math.floor(w / B)), gh = Math.max(1, Math.floor(h / B));
  var small = mk(gw, gh), sm = small.getContext('2d');
  sm.imageSmoothingQuality = 'high'; sm.drawImage(orig, 0, 0, gw, gh);
  var pix = mk(w, h), p = pix.getContext('2d');
  p.imageSmoothingEnabled = false; p.drawImage(small, 0, 0, w, h);
  // brightness per block, stretched between the 35th and 97th percentile so the face shows
  var d = sm.getImageData(0, 0, gw, gh).data, lum = new Float32Array(gw * gh);
  for (var i = 0; i < gw * gh; i++) lum[i] = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
  var sorted = Array.from(lum).sort(function (a, b) { return a - b; });
  var lo = sorted[Math.floor(sorted.length * .35)], hi = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * .97))];
  var bin = mk(w, h), bc = bin.getContext('2d');
  bc.fillStyle = 'rgb(2,8,8)'; bc.fillRect(0, 0, w, h);
  bc.font = '700 20px ' + MONO; bc.textAlign = 'center'; bc.textBaseline = 'middle';
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var j = 0; j < gh; j++) for (var k = 0; k < gw; k++) {
    var v = clamp((lum[j * gw + k] - lo) / Math.max(hi - lo, 1e-3));
    var col;
    if (v < .10) col = 'rgb(9,28,22)';
    else { var t = Math.pow(clamp((v - .10) / .45), .7); col = 'rgb(' + Math.round(lerp(50, 215, t)) + ',' + Math.round(lerp(160, 255, t)) + ',' + Math.round(lerp(105, 225, t)) + ')'; }
    bc.fillStyle = col; bc.fillText(rnd() < .5 ? '0' : '1', k * B + B / 2, j * B + B / 2 + 1);
  }
  L = { orig: orig, pix: pix, bin: bin, w: w, h: h };
}

/* ---------------- drawing ---------------- */
function drawBackground(count) {
  cx.fillStyle = NAVY; cx.fillRect(0, 0, W, H);
  cx.fillStyle = '#0f1e40'; cx.fillRect(0, 0, W, 190);
  cx.strokeStyle = 'rgba(37,190,110,.6)'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(0, 190); cx.lineTo(W, 190); cx.stroke();
  cx.fillStyle = '#25a064'; cx.beginPath(); cx.arc(90, 95, 48, 0, 7); cx.fill();
  cx.fillStyle = WHITE; cx.font = '700 38px ' + MONO; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('GP', 90, 97);
  cx.textAlign = 'left'; cx.font = '700 42px ' + MONO; cx.fillText('UMS GEMINI PRO', 165, 80);
  cx.fillStyle = DIM; cx.font = '28px ' + MONO; cx.fillText('411 members', 165, 128);
  cx.fillStyle = WHITE; cx.font = '700 54px ' + MONO; cx.fillText('23:58', 40, 257);
  rr(cx, W - 500, 210, 470, 94, 22); cx.fillStyle = 'rgba(4,10,26,.85)'; cx.fill(); cx.strokeStyle = WHITE; cx.lineWidth = 3; cx.stroke();
  cx.fillStyle = WHITE; cx.font = '700 40px ' + MONO; cx.textAlign = 'center'; cx.fillText('SUBMITTED ' + count + '/47', W - 265, 258);
}

function drawBox(mouth, t) {
  var x = 540, y = 1640 + Math.sin(t * 2.4) * 6;
  cx.lineWidth = 6; cx.strokeStyle = WHITE;
  [-80, 80].forEach(function (fx) { cx.fillStyle = '#18294f'; cx.beginPath(); cx.ellipse(x + fx, y + 142, 40, 17, 0, 0, 7); cx.fill(); cx.stroke(); });
  rr(cx, x - 150, y - 130, 300, 270, 70); cx.fillStyle = '#162a56'; cx.fill(); cx.stroke();
  var a = (-90 + 90 * ss(mouth)) * Math.PI / 180, fx0 = x + 150, fy0 = y + 20, tx = fx0 + 90 * Math.cos(a), ty = fy0 + 90 * Math.sin(a);
  cx.beginPath(); cx.moveTo(fx0, fy0); cx.lineTo(tx, ty); cx.stroke();
  cx.fillStyle = PINK; cx.beginPath(); cx.moveTo(tx, ty); cx.lineTo(tx + 40 * Math.cos(a + 1.57), ty + 40 * Math.sin(a + 1.57)); cx.lineTo(tx - 30 * Math.cos(a), ty - 30 * Math.sin(a)); cx.fill();
  [-60, 60].forEach(function (ex) {
    if (mouth > .3) { cx.fillStyle = WHITE; cx.beginPath(); cx.ellipse(x + ex, y - 60, 20, 20, 0, 0, 7); cx.fill(); }
    else { cx.beginPath(); cx.arc(x + ex, y - 70, 26, .2, 2.95); cx.stroke(); }
  });
  cx.fillStyle = 'rgba(255,112,168,.6)';
  [-100, 100].forEach(function (ex) { cx.beginPath(); cx.ellipse(x + ex, y - 19, 20, 11, 0, 0, 7); cx.fill(); });
  var mh = 10 + 60 * mouth; rr(cx, x - 80, y + 20 - mh / 2, 160, mh, Math.min(mh / 2, 30));
  cx.fillStyle = '#02050e'; cx.fill(); cx.stroke();
}

function heart(x, y, s, a) {
  cx.save(); cx.globalAlpha = a; cx.fillStyle = PINK; cx.translate(x, y); cx.scale(s / 30, s / 30);
  cx.beginPath(); cx.moveTo(0, 12); cx.bezierCurveTo(-34, -10, -16, -36, 0, -18); cx.bezierCurveTo(16, -36, 34, -10, 0, 12); cx.fill(); cx.restore();
}
function burst(p, seed) {
  if (p <= 0 || p >= 1) return;
  for (var i = 0; i < 8; i++) {
    var r1 = Math.sin(seed * 31 + i * 12.9) * .5 + .5, r2 = Math.sin(seed * 17 + i * 7.3) * .5 + .5;
    var ang = -Math.PI / 2 + (r1 - .5) * 2.4, rad = 260 * (1 - Math.pow(1 - p, 3)) * (.6 + .6 * r2);
    heart(540 + rad * Math.cos(ang), 1600 + rad * Math.sin(ang) - 120 * p, 40 * (1 - p * .5), 1 - p);
  }
}

function fileCard(pct) {
  var cw = 880, ch = 280, c = mk(cw, ch), g = c.getContext('2d');
  rr(g, 3, 3, cw - 6, ch - 6, 26); g.fillStyle = 'rgba(10,30,28,.96)'; g.fill(); g.strokeStyle = GREEN; g.lineWidth = 4; g.stroke();
  var tw = Math.round(L.w * 210 / L.h); g.drawImage(L.orig, 34, 35, tw, 210);
  g.strokeStyle = GREEN; g.lineWidth = 3; g.strokeRect(34, 35, tw, 210);
  var x0 = 34 + tw + 34; g.textBaseline = 'middle';
  g.fillStyle = WHITE; g.font = '700 ' + (fileName.length > 22 ? 32 : 40) + 'px ' + MONO; g.fillText(fileName, x0, 70);
  g.fillStyle = DIM; g.font = '30px ' + MONO; g.fillText(fileSize + ' · ENCRYPTED', x0, 120);
  var bx1 = cw - 36; rr(g, x0, 160, bx1 - x0, 28, 14); g.fillStyle = '#040e0c'; g.fill(); g.strokeStyle = 'rgba(60,205,120,.6)'; g.lineWidth = 2; g.stroke();
  if (pct > 0) { rr(g, x0 + 4, 164, (bx1 - x0 - 8) * pct, 20, 10); g.fillStyle = GREEN; g.fill(); }
  g.fillStyle = GREEN; g.font = '700 32px ' + MONO; g.fillText(pct >= 1 ? 'UPLOADED' : 'UPLOADING ' + Math.floor(pct * 100) + '%', x0, 226);
  return c;
}
function pasteCenter(src, x, y, sc, a) {
  if (a <= 0 || sc <= 0) return;
  cx.save(); cx.globalAlpha = a; cx.drawImage(src, x - src.width * sc / 2, y - src.height * sc / 2, src.width * sc, src.height * sc); cx.restore();
}

/* one frame of the upload at time s (seconds into the item) */
function frame(s, ph, count) {
  var t1 = ph[0], t2 = t1 + ph[1], t3 = t2 + ph[2], t4 = t3 + ph[3], t5 = t4 + ph[4], t6 = t5 + ph[5];
  var mouth = ss((s - (t5 - .12)) / .12) * (1 - ss((s - (t6 - .04)) / .04));
  var done = s >= t6;
  drawBackground(count + (done ? 1 : 0));
  drawBox(mouth, s);
  var w = L.w, h = L.h, hero = ph[1] >= .6, X = CENTER[0], Y = CENTER[1];
  if (s < t3) {
    var sc = s < t1 ? lerp(.55, 1, easeBack(s / t1)) : 1;
    var y = s >= t1 ? h * clamp((s - t1) / ph[1]) * 1.12 : -1, band = h * .22;
    var c = mk(w, h), g = c.getContext('2d');
    g.drawImage(L.orig, 0, 0);
    if (y > 0) {
      var yb = Math.round(clamp(y - band, 0, h)), yp = Math.round(clamp(y, 0, h));
      if (yb > 0) g.drawImage(L.bin, 0, 0, w, yb, 0, 0, w, yb);
      if (yp > yb) g.drawImage(L.pix, 0, yb, w, yp - yb, 0, yb, w, yp - yb);
    }
    pasteCenter(c, X, Y, sc, 1);
    if (y >= 0 && y <= h + 5) {
      var ly = Y - h / 2 + Math.min(y, h);
      [[26, .10], [14, .18], [6, .35]].forEach(function (b) { cx.fillStyle = 'rgba(60,205,120,' + b[1] + ')'; cx.fillRect(X - w / 2 - 20, ly - b[0], w + 40, b[0] * 2); });
      cx.strokeStyle = 'rgb(200,255,220)'; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(X - w / 2 - 30, ly); cx.lineTo(X + w / 2 + 30, ly); cx.stroke();
    }
    if (hero && s >= t1) {
      var x0 = X - w / 2 - 24, y0 = Y - h / 2 - 24, x1 = X + w / 2 + 24, y1 = Y + h / 2 + 24;
      cx.strokeStyle = GREEN; cx.lineWidth = 5;
      [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(function (b) {
        cx.beginPath(); cx.moveTo(b[0] + 60 * b[2], b[1]); cx.lineTo(b[0], b[1]); cx.lineTo(b[0], b[1] + 60 * b[3]); cx.stroke();
      });
      var pct = Math.floor(100 * clamp((s - t1) / ph[1]));
      cx.fillStyle = GREEN; cx.font = '700 32px ' + MONO; cx.textAlign = 'center';
      cx.fillText(pct < 100 ? 'SCANNING SUBMISSION ... ' + pct + '%' : 'CONVERTING TO EVIDENCE', X, Math.min(y1 + 44, 1440));
    }
  } else if (s < t4) {
    var q = ss((s - t3) / ph[3]);
    var bw = lerp(w, 880, q), bh = lerp(h, 280, q);
    cx.save(); cx.globalAlpha = 1 - q; cx.drawImage(L.bin, X - bw / 2, Y - bh / 2, bw, bh); cx.restore();
    pasteCenter(fileCard(0), X, Y, lerp(.6, 1, q), q);
  } else if (!done) {
    var pc = clamp((s - t4) / (ph[4] * .75));
    var card = fileCard(pc);
    if (s < t5) pasteCenter(card, X, Y, 1, 1);
    else { var q2 = ss((s - t5) / ph[5]); pasteCenter(card, lerp(X, MOUTH[0], q2), lerp(Y, MOUTH[1], q2), lerp(1, .08, q2), 1); }
  }

/* ---------------- sound (Web Audio, made on the fly) ---------------- */
var AC = null, dest = null;
function audio() {
  if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); dest = AC.createGain(); dest.gain.value = .9; dest.connect(AC.destination); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function env(g, t0, a, peak, d) { g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.linearRampToValueAtTime(peak, t0 + Math.max(a, d - .05)); g.gain.linearRampToValueAtTime(0, t0 + d); }
function scanBuzz(t0, d) {
  var o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), hum = AC.createOscillator(), hg = AC.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(500, t0); o.frequency.linearRampToValueAtTime(1400, t0 + d);
  f.type = 'lowpass'; f.frequency.value = 2500; o.connect(f); f.connect(g); g.connect(dest); env(g, t0, .03, .05, d);
  hum.frequency.value = 60; hum.connect(hg); hg.connect(dest); env(hg, t0, .03, .08, d);
  o.start(t0); o.stop(t0 + d + .05); hum.start(t0); hum.stop(t0 + d + .05);
}
function blip(t0, f, d, v) { var o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.connect(g); g.connect(dest);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0005, t0 + d); o.start(t0); o.stop(t0 + d + .02); }
var NOISE = null;

  n.buffer = NOISE; f.type = 'bandpass'; f.Q.value = .9; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + d);
  n.connect(f); f.connect(g); g.connect(dest);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + d * .5); g.gain.linearRampToValueAtTime(0, t0 + d);
  n.start(t0); n.stop(t0 + d + .02);
}
function ding(t0) { blip(t0, 1320, .7, .18); blip(t0, 1980, .6, .08); }
function boop(t0) { var o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(900, t0); o.frequency.linearRampToValueAtTime(480, t0 + .14);
  o.connect(g); g.connect(dest); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.35, t0 + .03); g.gain.linearRampToValueAtTime(0, t0 + .14); o.start(t0); o.stop(t0 + .16); }
function pop(t0) { var o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(1400, t0); o.frequency.linearRampToValueAtTime(2600, t0 + .06);
  o.connect(g); g.connect(dest); g.gain.setValueAtTime(.15, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .06); o.start(t0); o.stop(t0 + .08); }
function scheduleSound(t0, ph) {
  var t1 = t0 + ph[0], t3 = t1 + ph[1] + ph[2], t4 = t3 + ph[3], t6 = t4 + ph[4] + ph[5];
  scanBuzz(t1, ph[1]);
  if (ph[1] >= .6) for (var k = 0; k * .07 < ph[1]; k++) blip(t1 + k * .07, 2200 + 300 * (k % 3), .03, .05);
  whoosh(t3, Math.max(.15, ph[3] + .05), 3000, 600, .5);
  ding(t4 + ph[4] * .75);
  whoosh(t6 - ph[5], ph[5] + .1, 600, 3000, .25);
  boop(t6 - .05); pop(t6 + .03); pop(t6 + .11);

/* ---------------- playback ---------------- */
var count = 46, playing = false, rafId = null;
function play(ph) {
  if (playing || !L) return;
  playing = true; setButtons(true);
  var ac = audio(), startA = ac.currentTime + .05, startP = performance.now() + 50, total = ph.reduce(function (a, b) { return a + b; }, 0) + .8;
  scheduleSound(startA, ph);
  (function tick() {
    var s = (performance.now() - startP) / 1000;
    frame(Math.max(0, s), ph, count);
    if (s < total) rafId = requestAnimationFrame(tick);
    else { count = count >= 47 ? 46 : count + 1; playing = false; setButtons(false); if (recDone) recDone(); }
  })();
}
function setButtons(b) { ['go', 'fast', 'rec'].forEach(function (id) { document.getElementById(id).disabled = b; }); }

/* record the hero run as a WebM video with sound (browser support varies) */
var recDone = null;
document.getElementById('rec').onclick = function () {
  if (!window.MediaRecorder || !cv.captureStream) { alert('This browser cannot record the canvas. Try Chrome or Firefox on a computer.'); return; }
  var ac = audio(), ad = ac.createMediaStreamDestination(); dest.connect(ad);
  var stream = new MediaStream(cv.captureStream(30).getVideoTracks().concat(ad.stream.getAudioTracks()));
  var chunks = [], mr = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm' });
  mr.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
  mr.onstop = function () { dest.disconnect(ad); var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'scan-to-file.webm'; a.click(); };
  recDone = function () { recDone = null; setTimeout(function () { mr.stop(); }, 200); };
  mr.start(); setTimeout(function () { play(PH_HERO); }, 150);
};
document.getElementById('go').onclick = function () { play(PH_HERO); };
document.getElementById('fast').onclick = function () { play(PH_FAST); };

/* ---------------- loading images ---------------- */
function status(msg, bad) { var el = document.getElementById('status'); if (el) { el.style.color = bad ? '#ff70a8' : '#3ccd78'; el.textContent = msg; } }
var MAXPX = 1600;
/* shrink big phone photos first so every browser can handle them */
function capped(src) {
  var w = src.width, h = src.height, s = Math.min(1, MAXPX / Math.max(w, h));
  if (!w || !h) throw new Error('image has no size');
  var c = mk(Math.round(w * s), Math.round(h * s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
